name: Conservative legacy cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy.yml'
      - 'scripts/cleanup_legacy.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare conservative cleanup
        run: python scripts/cleanup_legacy.py
      - name: Run full test suite
        run: npm test
      - name: Commit cleanup atomically
        run: |
          git config user.name "Prompt.ai cleanup"
          git config user.email "53699011+lars0308@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --check
          git commit -m "Remove obsolete duplicate onboarding code"
          git push origin HEAD:main
