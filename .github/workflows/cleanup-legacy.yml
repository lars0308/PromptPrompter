name: Conservative legacy cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove proven legacy code without changing behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # HTML: remove the superseded video onboarding dialog if an older copy is
          # still present. Current production HTML already has this block removed.
          html = read('index.html')
          html, count = re.subn(r'\n\s*<dialog id="welcomeIntroDialog"\b.*?</dialog>\s*\n','\n',html,count=1,flags=re.S)
          if count not in (0,1):
              raise SystemExit(f'index.html: legacy welcome dialog matches={count}')
          write('index.html', html)

          # Core JS: remove only references belonging to that deleted legacy dialog.
          app = read('app.js')
          app = replace_once(app, '  const ONBOARDING_KEY = "prompt-ai-welcome-seen-v1";\n', '', 'app onboarding constant')
          app = replace_once(app, ',"welcomeIntroDialog","closeWelcomeIntroBtn","confirmWelcomeIntroBtn"', '', 'app cached legacy intro ids')
          app, count = re.subn(r'\n  function closeWelcomeIntro\(\)\{.*?\n  function showWelcomeIntroOnce\(\)\{.*?\}\n','\n',app,count=1,flags=re.S)
          if count != 1:
              raise SystemExit(f'app.js: legacy intro functions matches={count}')
          legacy_binding = "    el.closeWelcomeIntroBtn?.addEventListener('click',closeWelcomeIntro);el.confirmWelcomeIntroBtn?.addEventListener('click',closeWelcomeIntro);el.welcomeIntroDialog?.addEventListener('cancel',event=>{event.preventDefault();closeWelcomeIntro()});"
          app = replace_once(app, legacy_binding, '', 'app legacy intro bindings')
          app = replace_once(app,"    if(sessionStorage.getItem(CONTINUE_WORKFLOW_KEY)){sessionStorage.removeItem(CONTINUE_WORKFLOW_KEY);showWorkflow(1);}\n    else setTimeout(showWelcomeIntroOnce,350);","    if(sessionStorage.getItem(CONTINUE_WORKFLOW_KEY)){sessionStorage.removeItem(CONTINUE_WORKFLOW_KEY);showWorkflow(1);}",'app legacy intro init branch')
          write('app.js', app)

          # Loader: keep the new boot intro, migrate the one still-useful route-shield
          # observer from intro-flow-fix.js, and stop loading that obsolete file.
          admin = read('admin-console.js')
          admin = replace_once(admin, "  const ONBOARDING_KEY='prompt-ai-welcome-seen-v1';\n", '', 'admin onboarding constant')
          admin = replace_once(admin, "    try{localStorage.setItem(ONBOARDING_KEY,'1')}catch{}\n", '', 'admin onboarding write')
          admin = replace_once(admin, "await load('./intro-flow-fix.js?v=20260810-2');", '', 'admin legacy intro loader')
          admin = admin.replace("#welcomeIntroDialog .welcome-intro-body,#welcomeIntroDialog .intro-close{visibility:hidden!important}", '')
          route_guard = """
          function preserveInternalRouteReloads(){
            const observer=new MutationObserver(records=>{for(const record of records)for(const node of record.addedNodes){if(!(node instanceof Element))continue;const shield=node.matches?.('.prompt-route-shield')?node:node.querySelector?.('.prompt-route-shield');if(!shield)continue;try{sessionStorage.setItem(CONTINUE_WORKFLOW_KEY,'1')}catch{}shield.querySelector('img')?.remove()}});
            observer.observe(document.documentElement,{childList:true,subtree:true});
          }

          """
          anchor = '  function mountBootIntro(){\n'
          if anchor not in admin:
              raise SystemExit('admin-console.js: boot intro anchor missing')
          admin = admin.replace(anchor, route_guard + anchor, 1)
          admin = replace_once(admin, '  mountBootIntro();\n', '  preserveInternalRouteReloads();\n  mountBootIntro();\n', 'admin route guard init')
          write('admin-console.js', admin)

          # CSS: remove selectors that existed only for the deleted onboarding dialog,
          # while preserving shared action and agent dialog declarations.
          css = read('styles.css')
          replacements = {
              '.welcome-intro-dialog,.app-action-dialog,.agent-launch-dialog{': '.app-action-dialog,.agent-launch-dialog{',
              '.welcome-intro-dialog .dialog-frame,.app-action-dialog .dialog-frame,.agent-launch-dialog .dialog-frame{': '.app-action-dialog .dialog-frame,.agent-launch-dialog .dialog-frame{',
              '.welcome-intro-dialog::backdrop,.app-action-dialog::backdrop,.agent-launch-dialog::backdrop{': '.app-action-dialog::backdrop,.agent-launch-dialog::backdrop{',
              '.intro-close,.agent-launch-close{': '.agent-launch-close{',
              '.welcome-intro-body,.agent-launch-body{': '.agent-launch-body{',
              '.welcome-intro-body>span,.agent-launch-body>span,.app-action-body>span{': '.agent-launch-body>span,.app-action-body>span{',
              '.welcome-intro-body h2,.agent-launch-body h2,.app-action-body h2{': '.agent-launch-body h2,.app-action-body h2{',
              '.welcome-intro-body>p,.agent-launch-body>p,.app-action-body>p{': '.agent-launch-body>p,.app-action-body>p{',
              '.welcome-intro-body,.agent-launch-body,.app-action-body{': '.agent-launch-body,.app-action-body{',
              '.welcome-intro-body h2,.agent-launch-body h2{': '.agent-launch-body h2{',
          }
          for old, new in replacements.items():
              css = css.replace(old, new)
          legacy_only_prefixes = ('.welcome-intro-video{','.welcome-intro-body ol{','.welcome-intro-body li{','.welcome-intro-body li>b{','.welcome-intro-body li strong,','.welcome-intro-body li small{','.welcome-intro-body>.solid-btn{')
          css_lines = [line for line in css.splitlines() if not line.strip().startswith(legacy_only_prefixes)]
          css = '\n'.join(css_lines) + ('\n' if css.endswith('\n') else '')
          write('styles.css', css)

          # Final home layer: remove a proven unused bookkeeping variable only.
          home = read('promptai-home-final.js')
          home = home.replace("  let timer=0,lastTitle='';", "  let timer=0;")
          home = home.replace('    const desired=name?`Willkommen, ${name}.`:\'Willkommen.\';lastTitle=desired;\n', '    const desired=name?`Willkommen, ${name}.`:\'Willkommen.\';\n')
          write('promptai-home-final.js', home)

          # Service worker must no longer cache the removed legacy JS file.
          sw = read('sw.js')
          sw = sw.replace(",'./intro-flow-fix.js'", '').replace(",'/intro-flow-fix.js'", '')
          write('sw.js', sw)

          # Tests now verify the current background-loading intro rather than the old
          # video/onboarding implementation.
          tests = read('tests/smoke.test.mjs')
          old_test = "test('intro is a logo splash and no longer depends on intro video playback',async()=>{const src=await text('intro-flow-fix.js');assert.match(src,/prompt-logo-splash/);assert.match(src,/sitebrief-logo\\.svg/);assert.match(src,/#278bc2/);assert.match(src,/removeAttribute\\('autoplay'\\)/)});"
          new_test = "test('app boot intro covers background loading without legacy media',async()=>{const src=await text('admin-console.js'),html=await text('index.html'),sw=await text('sw.js');assert.match(src,/promptAppBoot/);assert.match(src,/sitebrief-logo\\.svg/);assert.match(src,/releaseBootIntro/);assert.match(src,/preserveInternalRouteReloads/);assert.doesNotMatch(src,/intro-flow-fix\\.js|welcomeIntroDialog|ONBOARDING_KEY/);assert.doesNotMatch(html,/welcomeIntroDialog|welcome-intro-video|intro\\.(?:webm|mp4)/);assert.doesNotMatch(sw,/intro-flow-fix\\.js/)});"
          tests = replace_once(tests, old_test, new_test, 'legacy intro smoke test')
          write('tests/smoke.test.mjs', tests)

          # Remove files that no longer have a runtime consumer.
          for path in ('intro-flow-fix.js','intro.mp4','intro.webm'):
              p=Path(path)
              if p.exists():
                  p.unlink()

          # The temporary workflow removes itself in the cleanup commit.
          Path('.github/workflows/cleanup-legacy.yml').unlink(missing_ok=True)

          # Safety assertions: legacy onboarding is gone, current intro and all plan /
          # workflow cores remain.
          runtime = {'index.html':read('index.html'),'styles.css':read('styles.css'),'app.js':read('app.js'),'admin-console.js':read('admin-console.js'),'sw.js':read('sw.js')}
          forbidden = re.compile(r'welcomeIntroDialog|welcome-intro-video|intro-flow-fix\\.js|intro\\.(?:webm|mp4)|ONBOARDING_KEY')
          for name, content in runtime.items():
              if forbidden.search(content):
                  raise SystemExit(f'{name}: legacy onboarding reference remains')
          if 'promptAppBoot' not in runtime['admin-console.js'] or 'releaseBootIntro' not in runtime['admin-console.js']:
              raise SystemExit('current boot intro was accidentally removed')
          if "const PLAN_RULES" not in runtime['app.js'] or 'ultimate' not in runtime['app.js'] or 'pro' not in runtime['app.js']:
              raise SystemExit('plan/permission core was accidentally changed')
          if 'workspaceNewProjectBtn' not in runtime['app.js'] or 'buildMasterPrompt' not in runtime['app.js']:
              raise SystemExit('core workflow behavior was accidentally changed')
          PY
      - name: Run full test suite
        run: npm test
      - name: Commit cleanup atomically
        run: |
          git config user.name "Prompt.ai cleanup"
          git config user.email "53699011+lars0308@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --check
          git commit -m "Remove obsolete duplicate onboarding code"
          git push origin HEAD:main
