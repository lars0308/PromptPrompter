name: Bootstrap SiteBrief V6.2

on:
  push:
    paths:
      - '.github/workflows/bootstrap-sitebrief.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify SiteBrief
        shell: bash
        run: |
          cat .payload/00 .payload/01 .payload/02 .payload/03 .payload/04 \
              .payload/05 .payload/06 .payload/07 .payload/08 .payload/09 \
              .payload/10 .payload/11 .payload/12 .payload/13 .payload/14 \
              .payload/15 .payload/16 .payload/17 .payload/18 .payload/19 \
              .payload/20 > /tmp/sitebrief.b64
          base64 -d /tmp/sitebrief.b64 > /tmp/sitebrief.zip
          echo "2081149cfea8c7df16f9b2fb0c2dbecaa06fd6f9e450c87432854eaed9cac9ae  /tmp/sitebrief.zip" | sha256sum -c -
          unzip -t /tmp/sitebrief.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/sitebrief.zip -d .
          git config user.name "SiteBrief Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy SiteBrief V6.2"
          git push origin HEAD:main
