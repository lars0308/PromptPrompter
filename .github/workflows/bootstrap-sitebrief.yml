name: Bootstrap SiteBrief V6.2

on:
  push:
    paths:
      - '.github/workflows/bootstrap-sitebrief.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with SiteBrief V6.2
        shell: bash
        run: |
          cat > /tmp/sitebrief.b64 <<'SITEBRIEF_ARCHIVE'
[... ELLIPSIZATION ...]
SITEBRIEF_ARCHIVE
          base64 -d /tmp/sitebrief.b64 > /tmp/sitebrief.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/sitebrief.zip -d .
          git config user.name 'SiteBrief Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy SiteBrief V6.2'
          git push origin HEAD:main
