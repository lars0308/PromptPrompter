name: Prompt.ai final UI QA

on:
  push:
    paths:
      - 'scripts/qa-final-ui-fast.mjs'
      - '.github/workflows/marketing-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start local Prompt.ai
        run: |
          python3 -m http.server 4173 >/tmp/prompt-ai-http.log 2>&1 &
          sleep 2
      - name: Run mobile and desktop UI QA
        run: node scripts/qa-final-ui-fast.mjs
      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: prompt-ai-v1-final-ui-qa
          path: marketing-screenshots/*
          if-no-files-found: error
          retention-days: 30
