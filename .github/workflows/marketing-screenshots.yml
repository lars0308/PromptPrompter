name: Prompt.ai marketing screenshots

on:
  push:
    paths:
      - 'scripts/capture-marketing-screenshots.mjs'
      - '.github/workflows/marketing-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start local Prompt.ai
        run: |
          python3 -m http.server 4173 >/tmp/prompt-ai-http.log 2>&1 &
          echo $! > /tmp/prompt-ai-http.pid
          sleep 2
      - name: Capture real UI screenshots
        run: node scripts/capture-marketing-screenshots.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: prompt-ai-v1-real-ui-screenshots
          path: marketing-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
